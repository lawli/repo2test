[project]
name = "apitest"
version = "0.2.5"
description = "Point Claude Code or Codex at your repo and get API tests with evidence behind every assertion"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "lawli" }]
keywords = ["api-testing", "end-to-end-testing", "pytest", "spring-boot", "claude-code", "codex", "agent-skills"]
dependencies = [
  "pytest>=8.0",
  "pytest-xdist>=3.5",
  "pytest-html>=4.1",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "jinja2>=3.1",
  "pymysql>=1.1",
  "redis>=5.0",
  "pika>=1.3",
  "click>=8.1",
  "httpx>=0.27",
  "jsonpath-ng>=1.6",
]

[project.optional-dependencies]
dev = ["ruff>=0.4", "mypy>=1.10", "pytest-cov>=5.0", "types-PyYAML>=6.0", "types-PyMySQL>=1.1", "respx>=0.21"]

[project.scripts]
apitest = "apitest.cli:main"

[project.entry-points.pytest11]
apitest = "apitest.plugin"

[project.urls]
Homepage = "https://github.com/lawli/repo2test"
Issues = "https://github.com/lawli/repo2test/issues"
Changelog = "https://github.com/lawli/repo2test/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apitest"]

[tool.hatch.build.hooks.custom]

[tool.pytest.ini_options]
testpaths = ["tests_internal"]
addopts = "-ra"
markers = ["integration: requires real infra (DB/Redis/MQ)"]
apitest_profile = "local"
apitest_profiles_dir = "profiles"
apitest_tests_root = "tests"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = ["pika.*", "jsonpath_ng.*"]
ignore_missing_imports = true
